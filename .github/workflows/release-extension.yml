name: Release extension

# Two ways to trigger this:
#   1. Push a tag like "ext-1.1.0"  ->  runs automatically
#   2. Actions tab -> "Release extension" -> "Run workflow" -> type a tag
#
# IMPORTANT: use a tag prefix here that's clearly different from the tag
# you use for the native host binary release (install.bat pins to that one
# specifically, e.g. "1.0.0" - see DEVELOPMENT.md). "ext-*" keeps the two
# completely separate so this workflow can never accidentally overwrite or
# shadow the host-binary release.

on:
  push:
    tags:
      - "ext-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. ext-1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Zip just the contents of extension/ (not the whole repo), so
      # extracting it gives a folder ready for "Load unpacked" as-is.
      #
      # Only Chrome is released here. Firefox is published on addons.mozilla.org
      # and Edge is published on the Microsoft Edge Add-ons store, so neither
      # needs a manual-install zip anymore - this workflow used to build both
      # (as browser-v2ray-runner-chrome-edge.zip and -firefox.zip), but those
      # store listings are now the only supported install path for those two.
      - name: Zip Chrome build
        run: |
          cd extension
          zip -r ../browser-v2ray-runner-chrome.zip . -x '*.DS_Store'
          cd ..

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: |
            browser-v2ray-runner-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
